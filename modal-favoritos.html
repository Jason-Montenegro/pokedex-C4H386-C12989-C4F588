<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Favoritos del perfil de entrenador">
    <title>Favoritos</title>
</head>

<body>

    <dialog id="modal-favoritos" open>
        <form method="dialog">
            <h1>Favoritos</h1>
            <p>3 Pokémon marcados como favoritos</p>
            <ul>
                <li>
                    <img src="assets/bulbasaur.png"
                         alt="Bulbasaur">
                    <p><strong>#001 Bulbasaur</strong></p>
                    <p>Tipos: Planta, Veneno</p>
                    <a href="detalle-pokemon-bulbasaur.html">
                        Ver detalle de Bulbasaur
                    </a>
                    <button type="button">
                        Quitar a Bulbasaur de favoritos
                    </button>
                </li>


                <li>
                    <img src="assets/charizard.png"
                         alt="Charizard">
                    <p><strong>#006 Charizard</strong></p>
                    <p>Tipos: Fuego, Volador</p>
                    <a href="detalle-pokemon-charizard.html">
                        Ver detalle de Charizard
                    </a>
                    <button type="button">
                        Quitar a Charizard de favoritos
                    </button>
                </li>


                <li>
                    <img src="assets/pikachu.png"
                         alt="Pikachu">
                    <p><strong>#025 Pikachu</strong></p>
                    <p>Tipo: Eléctrico</p>
                    <a href="detalle-pokemon-pikachu.html">
                        Ver detalle de Pikachu
                    </a>
                    <button type="button">
                        Quitar a Pikachu de favoritos
                    </button>
                </li>

            </ul>
            <button type="button">
                Agregar desde capturados
            </button>
            <button type="submit">
                Cerrar
            </button>
        </form>
    </dialog>

</body>

</html>
